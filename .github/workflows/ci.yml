name: TGK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test
        run: make check
      - name: Inspect shell installer
        run: sh -n install.sh
  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with UBSan
        run: make build CC=gcc CFLAGS='-O1 -g -std=c11 -fPIC -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all'
      - name: Run native tests
        run: python3 -m unittest discover -s tests -v
