name: TGK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install packaging test tools
        run: python -m pip install setuptools wheel
      - name: Build and test
        run: make check
      - name: Install self-contained copy and smoke-test native renderer
        run: |
          python -m pip install setuptools
          sh ./install.sh --copy --no-auto
          cd /tmp
          python -c "from tgk.canvas import _lib; _lib(); print('TGK copied installation OK')"
      - name: Inspect shell installer
        run: sh -n install.sh
  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging test tools
        run: python3 -m pip install setuptools wheel
      - name: Build with UBSan
        run: make build CC=gcc CFLAGS='-O1 -g -std=c11 -fPIC -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all'
      - name: Run native tests
        run: python3 -m unittest discover -s tests -v
