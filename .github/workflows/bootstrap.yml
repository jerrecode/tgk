name: Import TGK source bundle
on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode archive, compile and run tests
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/p*.b64 | base64 --decode > /tmp/tgk-source.tar.xz
          xz -t /tmp/tgk-source.tar.xz
          tar -xf /tmp/tgk-source.tar.xz -C .
          rm -r .bootstrap
          rm .github/workflows/bootstrap.yml
          make check
          sh -n install.sh
      - name: Commit validated sources to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: import TGK v0.2.0 framework, installer, docs and CI'
          git push origin HEAD:main
